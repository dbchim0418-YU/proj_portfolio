# 연구 활동 (최신순). 각 항목은 연구 활동 섹션의 카드 하나로 표시됩니다.
# id: 주소 뒤에 #id를 붙여 해당 활동으로 바로 이동할 때 쓰는 이름
# details: 제목(heading)과 문단(text) 또는 번호 목록(items)으로 이루어진 상세 설명
- id: "research-5g-mac"
  company: "5G NR MAC 스케줄러 연구"
  title: "네트워크 분야 학부연구실, 학부연구생"
  period: "2026년 7월 ~ 현재"
  status: "진행 중"
  context: "ns-3 5G-LENA 시뮬레이터에서 Lyapunov 기반 MAC 스케줄러를 단말 내 다중 플로우 환경으로 확장하는 연구"
  bullets: []
  details:
    - heading: "목적"
      text: "5G에서 여러 서비스가 함께 쓰일 때 품질(QoS)을 지키는 무선 자원 스케줄링 방법을 이해하고, 기존 Lyapunov 기반 스케줄러를 다중 플로우 환경으로 확장하는 것이 목표입니다."
    - heading: "내 역할"
      text: "연구 주제와 방향은 교수님 지도 아래 연구실에서 함께 정했으며, 본인이 맡은 부분은 다음과 같습니다."
      items:
        - "관련 논문을 읽고 개념, 기술 정리"
        - "ns-3(5G-LENA) 환경 빌드와 실행"
        - "스케줄러 코드 실행과 다중 플로우 확장을 단독으로 수행 (베어러 단계까지 구현, LC 단계 진행 중)"
        - "연구실 세미나에서 정리한 내용과 진행 상황을 발표해 지속적으로 공유"
    - heading: "진행 과정과 선택 이유"
      text: "논문 정리 → 시뮬레이터 빌드 → 기존 스케줄러 재현 → 다중 플로우 확장 순서로 진행했습니다. 실제 통신 장비 없이 5G 스케줄러를 실험하려면 시뮬레이터가 필요했습니다. 네트워크 연구에서 널리 쓰이는 ns-3를 사용했고, 참고 논문이 ns-3의 5G-LENA 모듈에서 실험했기 때문에 같은 환경을 골랐습니다. 덕분에 논문 결과를 먼저 재현한 뒤 확장할 수 있었습니다."
    - heading: "결과물"
      text: "개념 정리 발표 자료, 기존 스케줄러 실행 결과, 베어러 단계까지 구현한 다중 플로우 코드가 있습니다. (중간 결과) 다중 플로우에 대한 명확한 결과는 아직 도출하지 못했습니다."
    - heading: "배운 점과 다음 계획"
      text: "기존 스케줄러를 실행하며 5G-LENA에서 패킷이 TFT(트래픽 분류 규칙)로 분류되어 베어러에 연결되고, 다시 MAC의 논리 채널(LC)로 이어지는 구조를 이해했습니다. 다중 플로우는 아직 베어러 단계까지만 구현되어, 스케줄러가 실제로 보는 LC 단위로는 플로우가 구분되지 않아 명확한 결과를 얻지 못했습니다. 다음 단계로 교수님 피드백을 반영해 TFT → 베어러 → LC까지 이어지는 다중 플로우 흐름을 완성하고, 플로우별 결과를 확인할 계획입니다."

- id: "connect6-ai"
  company: "Connect6(육목) AI 에이전트"
  title: "인공지능 수업 과제 (개인)"
  period: "2026년 1학기"
  status: "완료"
  context: "한 턴에 두 돌을 두는 육목 규칙에 맞춘 대전 AI를 Python으로 구현"
  bullets: []
  details:
    - heading: "내용"
      text: "즉시 승리와 즉시 방어를 먼저 처리하는 규칙과 휴리스틱 점수 평가를 결합한 Python 에이전트를 구현했습니다. 처음 시도한 Minimax 방식은 서버에서 시간 초과가 발생해, 후보를 상위 6개로 줄인 두 돌 조합 평가 방식으로 바꿔 응답 시간을 약 200ms로 줄였고, 기본 벤치마크에서 8전 8승을 기록했습니다."
