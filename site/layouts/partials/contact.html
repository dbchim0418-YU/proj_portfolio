<section id="contact" class="section bg-navy">
  <div class="container container-xs mx-auto" style="max-width: 42rem; text-align: center;">
    <div class="fade-in">
      <h2 class="text-white font-display font-bold mb-5" style="font-size: clamp(2.25rem, 4vw, 3rem);">연락처</h2>
      <p class="text-lg text-white-70 leading-relaxed mb-12">
        연구와 프로젝트 코드는 GitHub에서 확인하실 수 있습니다.
      </p>

      <!-- 원본 테마의 예시 이메일, LinkedIn, 이력서 다운로드(파일 없음)는 제거하고 GitHub만 연결 -->
      <div style="display: flex; flex-direction: column; gap: 1rem; text-align: left;">
        <a href="{{ .Site.Params.github }}" target="_blank" rel="noreferrer" class="contact-link">
          <div class="contact-icon">
            <svg class="icon-md" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.56-.29-5.25-1.28-5.25-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.39-5.27 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg>
          </div>
          <div style="min-width: 0;">
            <p class="text-sm font-medium text-white-50">GitHub</p>
            <p class="font-semibold text-white">{{ .Site.Params.github | replaceRE "^https://" "" }}</p>
          </div>
        </a>
      </div>
    </div>
  </div>
</section>
